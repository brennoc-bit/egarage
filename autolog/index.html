<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ec3013" />
  <meta name="description" content="Autolog — custos, revisões, documentos e manutenção do seu carro ou moto, em um lugar só." />
  <title>Autolog · Sua garagem, em ordem</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icones/icone-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Autolog" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ds/modernist.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="app-hd" id="app-hd"></header>
    <main class="screen" id="screen"></main>
    <nav class="footer-nav" id="nav"></nav>
    <div class="toast-host" id="toast-host"></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/foto.js"></script>
  <script src="js/regiao.js"></script>
  <script src="js/fipe.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Só registra em origem segura (https ou localhost). Em http pela rede
    // local o navegador bloqueia — e é por isso que o app não fica instalável
    // quando aberto pelo IP do PC.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      // Instalado como app, não existe "recarregar forçado": o usuário não tem
      // barra de endereço. Então o app precisa se atualizar sozinho — procura
      // versão nova ao abrir e sempre que volta para a frente, e recarrega
      // quando o service worker novo assume.
      var tinhaControle = !!navigator.serviceWorker.controller;
      var recarregando = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!tinhaControle || recarregando) return; // 1ª instalação não recarrega
        recarregando = true;
        location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js')
          .then(function (reg) {
            reg.update();
            document.addEventListener('visibilitychange', function () {
              if (!document.hidden) reg.update();
            });
          })
          .catch(function (err) { console.warn('service worker não registrado:', err); });
      });
    }
  </script>
</body>
</html>
